name: Chain probe (temporary)
on:
  push:
    branches: [chain-probe]
    paths: [probe/probe.mjs, .github/workflows/chain-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: node probe/probe.mjs
      - run: |
          git config user.name "probe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/results.md && git commit -m "Probe results" && git push
