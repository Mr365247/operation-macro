name: Update restaurant nutrition

on:
  schedule:
    - cron: '41 10 * * 0'   # Sundays, early morning Eastern
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-restaurants.mjs
      - .github/workflows/restaurants.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install PDF reader
        run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: node scripts/update-restaurants.mjs
      - name: Commit updated library
        run: |
          git config user.name "restaurant-menu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restaurants.json
          git diff --cached --quiet || (git commit -m "Update restaurant nutrition library" && git pull --rebase && git push)
