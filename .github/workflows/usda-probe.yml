name: USDA probe (temporary)
on:
  push:
    branches: [usda-probe]
    paths: [probe/usda.mjs, .github/workflows/usda-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node probe/usda.mjs
      - run: |
          git config user.name "probe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/usda.json && git commit -m "USDA probe results" && git push
